<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_2 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js interactive 3D scene for DEEPVIXO hero
// Features an upward metallic arrow matching the DEEPVIXO logo motif, floating holographic analytics grids, connected marketing nodes, and glowing particle trails.

const container = document.getElementById('threejs-container') || document.body;
const width = container.clientWidth || window.innerWidth || 800;
const height = container.clientHeight || window.innerHeight || 600;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 24);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// Ambient & Directional Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0x1677E8, 2.5);
dirLight1.position.set(10, 20, 15);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0x52A5FF, 1.8);
dirLight2.position.set(-15, -10, 10);
scene.add(dirLight2);

const pointLight = new THREE.PointLight(0x00F0FF, 3.0, 50);
pointLight.position.set(0, 2, 8);
scene.add(pointLight);

// Group to hold the entire interactive dynamic rig
const heroRig = new THREE.Group();
scene.add(heroRig);

// 1. Upward Growth Arrow (Logo Inspiration: Deep V and dynamic angled Arrow)
const arrowGroup = new THREE.Group();

// Arrow shaft (extruded or angled beam)
const shaftGeo = new THREE.BoxGeometry(1.2, 7.5, 0.9);
const arrowMat = new THREE.MeshPhongMaterial({
  color: 0x1677E8,
  specular: 0x8ec5fc,
  shininess: 90,
  flatShading: false
});
const shaft = new THREE.Mesh(shaftGeo, arrowMat);
shaft.position.set(-0.5, -0.6, 0);
shaft.rotation.z = THREE.MathUtils.degToRad(-32);
arrowGroup.add(shaft);

// Arrow head (sharp cone / pyramid)
const headGeo = new THREE.ConeGeometry(2.2, 3.8, 4);
const headMat = new THREE.MeshPhongMaterial({
  color: 0x2A85F6,
  specular: 0xffffff,
  shininess: 120
});
const head = new THREE.Mesh(headGeo, headMat);
head.rotation.z = THREE.MathUtils.degToRad(-32);
head.rotation.y = Math.PI / 4;
head.position.set(2.4, 3.8, 0);
arrowGroup.add(head);

// Stylized "V" support bar in metallic deep navy
const vBarGeo = new THREE.BoxGeometry(1.1, 6.0, 0.8);
const vBarMat = new THREE.MeshPhongMaterial({
  color: 0x102A56,
  specular: 0x3d70b2,
  shininess: 70
});
const vBar = new THREE.Mesh(vBarGeo, vBarMat);
vBar.position.set(-2.6, 0.2, -0.2);
vBar.rotation.z = THREE.MathUtils.degToRad(32);
arrowGroup.add(vBar);

heroRig.add(arrowGroup);

// 2. Connected Marketing Nodes (SEO, Ads, Web, Growth spheres)
const nodesGroup = new THREE.Group();
const nodeGeo = new THREE.SphereGeometry(0.38, 24, 24);
const nodeMatActive = new THREE.MeshPhongMaterial({
  color: 0x38BDF8,
  emissive: 0x0284C7,
  emissiveIntensity: 0.6,
  shininess: 100
});
const nodeMatCore = new THREE.MeshPhongMaterial({
  color: 0x1677E8,
  shininess: 80
});

const nodePositions = [
  [-5.5, 2.5, 2],
  [-4.0, -3.2, 1],
  [4.5, -2.5, 2.5],
  [5.2, 3.0, 1.2],
  [-2.0, 5.0, -1],
  [3.2, 5.5, -0.5],
  [6.0, -0.5, 0.5]
];

const nodeMeshes = [];
nodePositions.forEach((pos, idx) => {
  const mesh = new THREE.Mesh(nodeGeo, idx % 2 === 0 ? nodeMatActive : nodeMatCore);
  mesh.position.set(pos[0], pos[1], pos[2]);
  nodesGroup.add(mesh);
  nodeMeshes.push(mesh);
});

// Connecting laser line network
const lineMat = new THREE.LineBasicMaterial({
  color: 0x38BDF8,
  transparent: true,
  opacity: 0.35,
  linewidth: 1.5
});

for (let i = 0; i < nodePositions.length; i++) {
  for (let j = i + 1; j < nodePositions.length; j++) {
    const dist = new THREE.Vector3(...nodePositions[i]).distanceTo(new THREE.Vector3(...nodePositions[j]));
    if (dist < 8.5) {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(...nodePositions[i]),
        new THREE.Vector3(...nodePositions[j])
      ]);
      const line = new THREE.Line(lineGeo, lineMat);
      nodesGroup.add(line);
    }
  }
}
heroRig.add(nodesGroup);

// 3. Floating Holographic Analytics Panels (glass cards in 3D space)
const panelGroup = new THREE.Group();
const panelMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.22,
  roughness: 0.1,
  metalness: 0.1,
  clearcoat: 1.0,
  clearcoatRoughness: 0.1,
  reflectivity: 0.8
});

// Card 1: Growth Trend Board
const card1Geo = new THREE.BoxGeometry(4.2, 2.6, 0.08);
const card1 = new THREE.Mesh(card1Geo, panelMat);
card1.position.set(-5.2, -1.2, 3.5);
card1.rotation.y = THREE.MathUtils.degToRad(18);
card1.rotation.x = THREE.MathUtils.degToRad(-6);
panelGroup.add(card1);

// Card 2: Conversion Metric Board
const card2Geo = new THREE.BoxGeometry(3.6, 2.2, 0.08);
const card2 = new THREE.Mesh(card2Geo, panelMat);
card2.position.set(5.0, 1.8, 3.0);
card2.rotation.y = THREE.MathUtils.degToRad(-20);
card2.rotation.x = THREE.MathUtils.degToRad(8);
panelGroup.add(card2);

heroRig.add(panelGroup);

// 4. Elegant Blue Light Trails and Ambient Digital Particles
const particleCount = 220;
const particleGeo = new THREE.BufferGeometry();
const particleCoords = new Float32Array(particleCount * 3);
const particleSpeeds = [];

for (let i = 0; i < particleCount * 3; i += 3) {
  particleCoords[i] = (Math.random() - 0.5) * 32;
  particleCoords[i + 1] = (Math.random() - 0.5) * 22;
  particleCoords[i + 2] = (Math.random() - 0.5) * 16;
  particleSpeeds.push({
    y: 0.015 + Math.random() * 0.03,
    amp: 0.2 + Math.random() * 0.5,
    seed: Math.random() * Math.PI * 2
  });
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(particleCoords, 3));

const particleMat = new THREE.PointsMaterial({
  color: 0x60A5FA,
  size: 0.22,
  transparent: true,
  opacity: 0.65,
  blending: THREE.AdditiveBlending
});

const particleSystem = new THREE.Points(particleGeo, particleMat);
scene.add(particleSystem);

// Mouse interaction tracking
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX - window.innerWidth / 2) * 0.001;
  mouseY = (e.clientY - window.innerHeight / 2) * 0.001;
});

// Resize listener
window.addEventListener('resize', () => {
  const newW = container.clientWidth || window.innerWidth;
  const newH = container.clientHeight || window.innerHeight;
  camera.aspect = newW / newH;
  camera.updateProjectionMatrix();
  renderer.setSize(newW, newH);
});

// Animation Loop
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  targetX += (mouseX - targetX) * 0.05;
  targetY += (mouseY - targetY) * 0.05;

  // Gentle floating oscillation
  heroRig.rotation.y = Math.sin(time * 0.4) * 0.12 + targetX * 1.5;
  heroRig.rotation.x = Math.cos(time * 0.35) * 0.08 - targetY * 1.5;
  heroRig.position.y = Math.sin(time * 0.8) * 0.35;

  // Floating pulses for panels and arrow head
  head.position.y = 3.8 + Math.sin(time * 2.0) * 0.15;
  head.position.x = 2.4 + Math.cos(time * 2.0) * 0.08;

  card1.position.y = -1.2 + Math.sin(time * 1.1) * 0.2;
  card2.position.y = 1.8 + Math.cos(time * 1.3) * 0.22;

  // Animate node pulses
  nodeMeshes.forEach((n, idx) => {
    n.position.y += Math.sin(time * 1.8 + idx) * 0.003;
  });

  // Upward particle flow
  const positions = particleSystem.geometry.attributes.position.array;
  for (let i = 1; i < positions.length; i += 3) {
    const sIdx = Math.floor(i / 3);
    positions[i] += particleSpeeds[sIdx].y;
    positions[i - 1] += Math.sin(time + particleSpeeds[sIdx].seed) * 0.008;
    if (positions[i] > 14) {
      positions[i] = -14;
    }
  }
  particleSystem.geometry.attributes.position.needsUpdate = true;
  particleSystem.rotation.y = time * 0.02;

  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_2 -->
</body>
</html>
