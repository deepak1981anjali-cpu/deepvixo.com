<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_14 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_14" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_14');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Interactive 3D Services Ecosystem for DEEPVIXO
// A realistic 3D holographic digital planet with concentric orbital rings, 
// 7 floating 3D service crystals/nodes (Web, SEO, Google Ads, Meta, Graphic, Email, WhatsApp)
// with laser data streams connecting to the core, ambient celestial particles, and mouse parallax.

const container = document.getElementById('threejs-container-SERVICES_3D') || document.getElementById('threejs-container') || document.body;
const width = container.clientWidth || window.innerWidth || 800;
const height = container.clientHeight || window.innerHeight || 600;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
camera.position.set(0, 0.6, 17);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
container.appendChild(renderer.domElement);

// Lighting: Deep navy ambient, electric cyan key, violet rim, core glow
const ambientLight = new THREE.AmbientLight(0x0a1936, 1.8);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0x38bdf8, 3.2);
keyLight.position.set(14, 16, 16);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x818cf8, 2.6);
rimLight.position.set(-16, -10, -10);
scene.add(rimLight);

const coreGlowLight = new THREE.PointLight(0x00f0ff, 4.0, 32);
coreGlowLight.position.set(0, 0, 4);
scene.add(coreGlowLight);

const rootGroup = new THREE.Group();
scene.add(rootGroup);

// 1. Core 3D Globe / Digital Services Matrix
const globeRadius = 4.0;
const globeGeo = new THREE.SphereGeometry(globeRadius, 64, 64);
const globeMat = new THREE.MeshPhongMaterial({
  color: 0x071530,
  emissive: 0x051226,
  specular: 0x2563eb,
  shininess: 60,
  flatShading: false
});
const globeCore = new THREE.Mesh(globeGeo, globeMat);
rootGroup.add(globeCore);

// Latitude / Longitude digital tech grid
const wireGeo = new THREE.WireframeGeometry(new THREE.SphereGeometry(globeRadius * 1.01, 36, 36));
const wireMat = new THREE.LineBasicMaterial({
  color: 0x1d4ed8,
  transparent: true,
  opacity: 0.32
});
const wireMesh = new THREE.LineSegments(wireGeo, wireMat);
globeCore.add(wireMesh);

// Glowing surface data clusters
const dotCount = 500;
const dotGeo = new THREE.BufferGeometry();
const dotPos = new Float32Array(dotCount * 3);
const dotCols = new Float32Array(dotCount * 3);

for (let i = 0; i < dotCount; i++) {
  const phi = Math.acos(-1 + (2 * i) / dotCount);
  const theta = Math.sqrt(dotCount * Math.PI) * phi;
  const r = globeRadius * 1.025;

  dotPos[i * 3] = r * Math.cos(theta) * Math.sin(phi);
  dotPos[i * 3 + 1] = r * Math.sin(theta) * Math.sin(phi);
  dotPos[i * 3 + 2] = r * Math.cos(phi);

  if (Math.random() > 0.35) {
    dotCols[i * 3] = 0.22;
    dotCols[i * 3 + 1] = 0.74;
    dotCols[i * 3 + 2] = 0.98; // Electric Cyan
  } else {
    dotCols[i * 3] = 0.08;
    dotCols[i * 3 + 1] = 0.45;
    dotCols[i * 3 + 2] = 0.95; // Royal Blue
  }
}
dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
dotGeo.setAttribute('color', new THREE.BufferAttribute(dotCols, 3));

const dotMat = new THREE.PointsMaterial({
  size: 0.18,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending
});
const globePoints = new THREE.Points(dotGeo, dotMat);
globeCore.add(globePoints);

// Atmosphere Haze
const atmoGeo = new THREE.SphereGeometry(globeRadius * 1.07, 48, 48);
const atmoMat = new THREE.MeshPhongMaterial({
  color: 0x38bdf8,
  transparent: true,
  opacity: 0.15,
  side: THREE.BackSide,
  blending: THREE.AdditiveBlending
});
const atmosphere = new THREE.Mesh(atmoGeo, atmoMat);
globeCore.add(atmosphere);

// 2. Multi-tier Orbital Rings
function createRing(innerR, outerR, tiltX, tiltZ, colorHex, opacityVal) {
  const rGeo = new THREE.RingGeometry(innerR, outerR, 96);
  const rMat = new THREE.MeshBasicMaterial({
    color: colorHex,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: opacityVal,
    blending: THREE.AdditiveBlending
  });
  const ring = new THREE.Mesh(rGeo, rMat);
  ring.rotation.x = tiltX;
  ring.rotation.z = tiltZ;
  return ring;
}

const ring1 = createRing(5.4, 5.75, Math.PI / 2.7, 0.45, 0x0284c7, 0.55);
const ring2 = createRing(6.6, 6.85, Math.PI / 2.2, -0.35, 0x60a5fa, 0.45);
const ring3 = createRing(7.9, 8.1, Math.PI / 3.1, 0.8, 0x818cf8, 0.35);

rootGroup.add(ring1);
rootGroup.add(ring2);
rootGroup.add(ring3);

// 3. 7 Floating 3D Service Beacons (Web, SEO, Google Ads, Meta Ads, Graphic Design, Email, WhatsApp)
const servicesData = [
  { label: 'WEB', color: 0x38bdf8, angle: 0.0, orbitR: 6.2, speed: 0.55, height: 1.2 },
  { label: 'SEO', color: 0x60a5fa, angle: 0.9, orbitR: 6.9, speed: 0.45, height: -1.4 },
  { label: 'G-ADS', color: 0x818cf8, angle: 1.8, orbitR: 5.8, speed: 0.6, height: 2.0 },
  { label: 'META', color: 0x0ea5e9, angle: 2.7, orbitR: 7.3, speed: 0.5, height: -0.6 },
  { label: 'DESIGN', color: 0x00f0ff, angle: 3.6, orbitR: 6.0, speed: 0.65, height: 1.5 },
  { label: 'EMAIL', color: 0x93c5fd, angle: 4.5, orbitR: 7.1, speed: 0.48, height: -1.9 },
  { label: 'WHATSAPP', color: 0x22d3ee, angle: 5.4, orbitR: 6.4, speed: 0.58, height: 0.7 }
];

const beaconNodes = [];

servicesData.forEach((s) => {
  const bGroup = new THREE.Group();

  // Futuristic Pill Housing
  const plateGeo = new THREE.CylinderGeometry(0.68, 0.68, 0.16, 24);
  const plateMat = new THREE.MeshPhongMaterial({
    color: 0x0b224c,
    emissive: 0x041128,
    specular: s.color,
    shininess: 95
  });
  const plate = new THREE.Mesh(plateGeo, plateMat);
  plate.rotation.x = Math.PI / 2;
  bGroup.add(plate);

  // Neon Halo
  const haloGeo = new THREE.TorusGeometry(0.74, 0.04, 16, 32);
  const haloMat = new THREE.MeshBasicMaterial({
    color: s.color,
    transparent: true,
    opacity: 0.85
  });
  const halo = new THREE.Mesh(haloGeo, haloMat);
  bGroup.add(halo);

  // Floating core gem
  const gemGeo = new THREE.OctahedronGeometry(0.35, 0);
  const gemMat = new THREE.MeshPhongMaterial({
    color: s.color,
    emissive: s.color,
    emissiveIntensity: 0.65,
    shininess: 100
  });
  const gem = new THREE.Mesh(gemGeo, gemMat);
  bGroup.add(gem);

  // Laser beam connecting beacon to globe surface
  const beamGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0, 0, 0)
  ]);
  const beamMat = new THREE.LineBasicMaterial({
    color: s.color,
    transparent: true,
    opacity: 0.45
  });
  const beam = new THREE.Line(beamGeo, beamMat);
  scene.add(beam);

  rootGroup.add(bGroup);
  beaconNodes.push({ group: bGroup, gem: gem, beam: beam, data: s });
});

// 4. Ambient Particle Dust
const pCount = 380;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(pCount * 3);
const pDrift = [];

for (let i = 0; i < pCount * 3; i += 3) {
  pPos[i] = (Math.random() - 0.5) * 44;
  pPos[i + 1] = (Math.random() - 0.5) * 32;
  pPos[i + 2] = (Math.random() - 0.5) * 24;
  pDrift.push({
    dy: (Math.random() - 0.5) * 0.007,
    dx: (Math.random() - 0.5) * 0.005
  });
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({
  color: 0x93c5fd,
  size: 0.16,
  transparent: true,
  opacity: 0.75,
  blending: THREE.AdditiveBlending
});
const stars = new THREE.Points(pGeo, pMat);
scene.add(stars);

// Mouse parallax tracking
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX - window.innerWidth / 2) * 0.0006;
  mouseY = (e.clientY - window.innerHeight / 2) * 0.0006;
});

window.addEventListener('resize', () => {
  const newW = container.clientWidth || window.innerWidth;
  const newH = container.clientHeight || window.innerHeight;
  camera.aspect = newW / newH;
  camera.updateProjectionMatrix();
  renderer.setSize(newW, newH);
});

// Animation Loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  targetX += (mouseX - targetX) * 0.05;
  targetY += (mouseY - targetY) * 0.05;

  // Globe rotation & tilt
  globeCore.rotation.y = time * 0.16;
  globeCore.rotation.x = 0.15 + Math.sin(time * 0.25) * 0.04;

  // Rings counter movement
  ring1.rotation.z = 0.45 + time * 0.06;
  ring2.rotation.z = -0.35 - time * 0.045;
  ring3.rotation.z = 0.8 + time * 0.08;

  // Parallax
  rootGroup.rotation.y = targetX * 1.6;
  rootGroup.rotation.x = -targetY * 1.1;
  rootGroup.position.y = Math.sin(time * 0.75) * 0.2;

  // Update 7 service nodes
  beaconNodes.forEach((node, idx) => {
    const d = node.data;
    const curAngle = d.angle + time * d.speed * 0.3;
    const x = Math.cos(curAngle) * d.orbitR;
    const z = Math.sin(curAngle) * (d.orbitR * 0.76);
    const y = d.height + Math.sin(time * 1.3 + idx) * 0.3;

    node.group.position.set(x, y, z);
    node.group.lookAt(camera.position);

    node.gem.rotation.y = time * 1.5;
    node.gem.rotation.x = time * 1.2;

    // Laser connection
    const surfPt = new THREE.Vector3(x, y, z).normalize().multiplyScalar(globeRadius);
    const wPos = new THREE.Vector3();
    node.group.getWorldPosition(wPos);

    const posArr = node.beam.geometry.attributes.position.array;
    posArr[0] = wPos.x;
    posArr[1] = wPos.y;
    posArr[2] = wPos.z;
    posArr[3] = surfPt.x;
    posArr[4] = surfPt.y;
    posArr[5] = surfPt.z;
    node.beam.geometry.attributes.position.needsUpdate = true;
  });

  // Particle drift
  const pArr = stars.geometry.attributes.position.array;
  for (let i = 0; i < pCount; i++) {
    const d = pDrift[i];
    pArr[i * 3 + 1] += d.dy;
    pArr[i * 3] += d.dx;
    if (pArr[i * 3 + 1] > 16) pArr[i * 3 + 1] = -16;
    if (pArr[i * 3 + 1] < -16) pArr[i * 3 + 1] = 16;
  }
  stars.geometry.attributes.position.needsUpdate = true;
  stars.rotation.y = time * 0.015;

  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_14 -->
</body>
</html>
